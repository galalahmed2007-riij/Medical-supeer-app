<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنصة الطبية الشاملة - Medical Super App</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .phone { width: 100%; max-width: 390px; background: #1e293b; border-radius: 40px; padding: 20px; border: 4px solid #334155; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); position: relative; }
        .notch { width: 120px; height: 22px; background: #0f172a; border-radius: 0 0 15px 15px; margin: -20px auto 18px auto; }
        .header { background: linear-gradient(135deg, #0d9488, #0f766e); padding: 18px; border-radius: 20px; text-align: center; margin-bottom: 18px; box-shadow: 0 10px 15px -3px rgba(13, 148, 136, 0.3); }
        .header h1 { font-size: 20px; font-weight: 800; color: #fff; }
        .header p { font-size: 12px; opacity: 0.85; margin-top: 4px; }
        .voice-btn { width: 100%; background: linear-gradient(135deg, #f59e0b, #d97706); border: none; padding: 14px; border-radius: 16px; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 18px; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3); transition: transform 0.2s; }
        .voice-btn:active { transform: scale(0.98); }
        .card-grid { display: flex; flex-direction: column; gap: 12px; }
        .card { background: #334155; border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; padding: 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: all 0.2s ease; }
        .card:hover { background: #475569; transform: translateY(-2px); }
        .icon-box { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff; }
        .bg-teal { background: #0d9488; }
        .bg-red { background: #ef4444; }
        .bg-blue { background: #3b82f6; }
        .bg-green { background: #10b981; }
        .info { flex: 1; margin-right: 14px; text-align: right; }
        .info h3 { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
        .info p { font-size: 12px; color: #94a3b8; }
        .arrow { color: #64748b; font-size: 14px; }
    </style>
</head>
<body>

    <div class="phone">
        <div class="notch"></div>
        
        <div class="header">
            <h1>المنصة الطبية الشاملة</h1>
            <p>Medical Super-App Experience</p>
        </div>

        <button class="voice-btn" onclick="speak('أهلاً بك في المنصة الطبية الشاملة. اختر الخدمة المطلوبة.')">
            <i class="fa-solid fa-volume-high"></i> استمع لإرشادات التطبيق
        </button>

        <div class="card-grid">
            <div class="card" onclick="speak('قسم تمريض المنازل')">
                <div class="icon-box bg-teal"><i class="fa-solid fa-user-nurse"></i></div>
                <div class="info">
                    <h3>تمريض منازل</h3>
                    <p>حجز زيارة تمريضية فورية</p>
                </div>
                <i class="fa-solid fa-chevron-left arrow"></i>
            </div>

            <div class="card" onclick="speak('قسم طوارئ الطرق الإسعافي')">
                <div class="icon-box bg-red"><i class="fa-solid fa-truck-medical"></i></div>
                <div class="info">
                    <h3>طوارئ الطرق SOS</h3>
                    <p>استغاثة سريعة لأقرب مسعف</p>
                </div>
                <i class="fa-solid fa-chevron-left arrow"></i>
            </div>

            <div class="card" onclick="speak('قسم استشارة الأطباء')">
                <div class="icon-box bg-blue"><i class="fa-solid fa-user-doctor"></i></div>
                <div class="info">
                    <h3>اسأل طبيباً</h3>
                    <p>محادثات ومكالمات فورية</p>
                </div>
                <i class="fa-solid fa-chevron-left arrow"></i>
            </div>

            <div class="card" onclick="speak('قسم الصيدليات والمستشفيات')">
                <div class="icon-box bg-green"><i class="fa-solid fa-hospital"></i></div>
                <div class="info">
                    <h3>الصيدليات والمستشفيات</h3>
                    <p>تتبع الأدوية وأسرّة الرعاية</p>
                </div>
                <i class="fa-solid fa-chevron-left arrow"></i>
            </div>
        </div>
    </div>

    <script>
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                var msg = new SpeechSynthesisUtterance(text);
                msg.lang = 'ar-EG';
                window.speechSynthesis.speak(msg);
            }
        }
    </script>

</body>
</html>
